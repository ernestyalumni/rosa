[workspace]
resolver = "2"
members = [
    "crates/rosa-core",
    "crates/rosa-llm",
    "crates/rosa-tools",
    "crates/rosa-ros2",
    "crates/rosa-cli",
]

[workspace.package]
version     = "0.1.0"
authors     = ["Ernest Yeung <ernestyalumni@gmail.com>"]
edition     = "2021"
license     = "Apache-2.0"
repository  = "https://github.com/ernestyalumni/rosa"

[workspace.dependencies]
# Core async runtime
tokio       = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process"] }
futures     = "0.3"
async-trait = "0.1"

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Error handling
thiserror   = "1"

# Observability
tracing     = "0.1"

# HTTP (adapters only)
reqwest     = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
bytes       = "1"

# Async generators / stream combinators
async-stream = "0.3"

# Schema derivation (tools)
schemars    = "0.8"
